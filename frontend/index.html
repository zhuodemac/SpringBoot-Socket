<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket 线程聊天室</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app">
        <header>
            <div>
                <h1>Socket + 线程 实时聊天</h1>
                <p>前端通过 WebSocket，后端用线程池处理 TCP Socket，REST 同步历史消息。</p>
            </div>
            <div class="badges">
                <span id="ws-status" class="badge off">WebSocket 未连接</span>
                <span id="tcp-count" class="badge">TCP 客户端 0</span>
                <span id="ws-count" class="badge">浏览器会话 0</span>
            </div>
        </header>

        <main>
            <section class="chat-panel">
                <div id="messages" class="messages"></div>
                <form id="chat-form">
                    <input id="nickname" type="text" maxlength="24" placeholder="昵称" required>
                    <input id="content" type="text" maxlength="200" placeholder="输入消息，回车发送" required>
                    <button type="submit">发送</button>
                </form>
            </section>

            <aside>
                <article>
                    <h2>线程池</h2>
                    <dl id="pool-stats"></dl>
                </article>
                <article>
                    <h2>相关线程</h2>
                    <ul id="thread-list"></ul>
                </article>
                <article>
                    <h2>TCP Socket 测试</h2>
                    <pre>nc localhost 19090
hello from tcp
quit</pre>
                </article>
            </aside>
        </main>
    </div>
    <script src="./app.js"></script>
</body>
</html>
